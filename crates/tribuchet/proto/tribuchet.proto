syntax = "proto3";

package tribuchet.v1;

// Worker-facing service. Workers dial the hub and keep a long-lived
// bidirectional stream open (NAT-friendly; the hub never dials workers).
service WorkerHub {
  // Single bidi stream multiplexing registration, heartbeats, build
  // assignment, path negotiation, chunk transfer, logs and results.
  rpc Session(stream WorkerMessage) returns (stream HubMessage);
}

message WorkerMessage {
  oneof msg {
    Register register = 1;
    Heartbeat heartbeat = 2;
    LogChunk log = 3;
    BuildResult result = 4;
    // Output chunks answering the hub's Need, then one eof.
    ChunkFrame chunk = 5;
    // One free build slot: the hub answers each request with at most
    // one BuildAssignment (worker-side admission).
    RequestJob request_job = 6;
    // Answer to a BuildAssignment whose dedupe_key matches a build the
    // worker already runs (or has finished but not delivered): the hub
    // skips staging and waits for the result, which arrives under the
    // new build_id. This is how builds survive a hub restart.
    Resumed resumed = 7;
    // Input paths the worker lacks a manifest for and chunks its
    // store lacks. The first Need answers the assignment and lists
    // every missing input path. May repeat any number of times.
    Need need = 8;
  }
}

message Resumed {
  string build_id = 1;
}

message RequestJob {}

message HubMessage {
  oneof msg {
    // Carries the input closure, with manifests inline where the hub
    // has them cached and does not know the worker to have the path.
    BuildAssignment assignment = 1;
    // Build tmp dir contents (structured attrs, passAsFile files).
    TmpDirArchive tmp_dir = 2;
    CancelBuild cancel = 3;
    // The hub received the result and all output chunks. The worker
    // keeps the build for redelivery until this arrives.
    ResultAck result_ack = 4;
    // Chunk data answering a Need, one eof per Need.
    ChunkFrame chunk = 5;
    // Manifest for a path listed in Need.paths.
    Manifest manifest = 6;
    // Output chunks the hub's cache lacks, sent after BuildResult.
    Need need = 7;
  }
}

// A store path, optionally with its Nix metadata and ordered chunk
// list. Concatenating the chunks yields the NAR.
message Manifest {
  string build_id = 1; // empty when embedded
  string store_path = 2;
  PathInfoMsg info = 3;
  bytes hashes = 4;          // n*32 bytes, BLAKE3 of uncompressed chunk
  repeated uint64 sizes = 5; // uncompressed, same order
}

message Need {
  string build_id = 1;
  repeated string paths = 2;
  bytes hashes = 3; // n*32 bytes, deduplicated
}

// One chunk as its own zstd frame: both ends store chunks in this
// form, so nothing is re-compressed in transit.
message ChunkFrame {
  string build_id = 1;
  bytes hash = 2; // 32 bytes, empty on eof
  bytes zstd = 3;
  bool eof = 4;
}

message ResultAck {
  string build_id = 1;
  // Stable identity of the build on the worker; build_id rotates when
  // a build is resumed under a new assignment.
  string dedupe_key = 2;
}

// Subset of Nix's ValidPathInfo needed to import a NAR.
message PathInfoMsg {
  bytes nar_sha256 = 1;          // hash of the uncompressed NAR
  uint64 nar_size = 2;           // uncompressed NAR size in bytes
  repeated string references = 3; // absolute store paths
  repeated string signatures = 4; // Nix-format "name:base64"
  string deriver = 5;             // absolute store path or empty
  string ca = 6;                  // content address string or empty
}

// Features are per system: an emulated system must not inherit e.g.
// "kvm" from the host.
message SystemCaps {
  string system = 1;            // e.g. "x86_64-linux"
  repeated string features = 2; // e.g. "kvm", "big-parallel"
}

message Register {
  string worker_name = 1;
  repeated SystemCaps caps = 2;
  // Dedupe keys of builds this worker still holds (running or finished
  // but undelivered). A freshly started hub assigns resubmitted jobs
  // with these keys to this worker, credit-free, instead of building
  // them again elsewhere.
  repeated string resumable_keys = 3;
  // Advisory capacity, summed across workers to size the max-jobs of
  // the generated nix.conf fragment. Not the RequestJob dispatch path.
  uint32 max_jobs = 4;
}

message Heartbeat {
  uint32 running_jobs = 1;
  double load1 = 2;
  // Current Register.resumable_keys. Keys not listed are no longer held.
  repeated string resumable_keys = 3;
}

message BuildAssignment {
  string build_id = 1;
  string system = 2;
  string builder = 3;
  repeated string args = 4;
  map<string, string> env = 5;
  // Scratch output paths, identical on client and worker.
  map<string, string> outputs = 6;
  string tmp_dir_in_sandbox = 7; // "/build"
  string store_dir = 8; // "/nix/store"
  bool fixed_output = 9; // grants network inside the sandbox
  // Hash of the full BuildRequest; stable across hub restarts, unlike
  // build_id. Keys the worker's resume bookkeeping.
  string dedupe_key = 10;
  repeated Manifest inputs = 11;
  // Dispatched via resumable_keys without consuming a RequestJob.
  bool credit_free = 12;
  repeated string required_features = 13;
}

message TmpDirArchive {
  string build_id = 1;
  bytes zstd_chunk = 2;
  bool eof = 3;
}

// One regular file of the client's build tmp dir, as
// u32-length-prefixed messages inside the zstd stream carried by
// TmpDirChunk / TmpDirArchive. Nix only puts plain non-executable
// files there, so a file is a basename plus contents and the unpacker
// fixes the modes.
message TmpDirFile {
  string name = 1; // basename, no "/"
  bytes data = 2;
}

message LogChunk {
  string build_id = 1;
  bytes data = 2;
}

message CancelBuild {
  string build_id = 1;
  // Stable identity of the build on the worker; build_id rotates when
  // a build is resumed under a new assignment.
  string dedupe_key = 2;
}

message BuildResult {
  string build_id = 1;
  int32 exit_code = 2;
  // Manifest per output (no info). The hub asks for the chunks it
  // lacks with Need and assembles the NAR.
  repeated Manifest outputs = 3;
  string error = 4;
  // Inner outputs and AddToStore'd paths the build's outputs
  // reference (recursive-nix). The hub registers each in the local
  // store via AddToStoreNar. Attach receives an AddedPath event per
  // registered extra.
  repeated Manifest extras = 5; // with info
}

// Local service between `tribuchet attach` and the hub, served on a unix
// socket. The hub is colocated with nix-daemon, so it reads input store
// paths directly from disk. Attach sends the request metadata followed
// by its packed build tmp dir contents, so the hub never reads the
// client's build directory.
service AttachHub {
  rpc Build(stream BuildMessage) returns (stream AttachEvent);
}

// Client-streamed submission: the BuildRequest, then TmpDirFile
// chunks terminated by an eof chunk.
message BuildMessage {
  oneof msg {
    BuildRequest request = 1;
    TmpDirChunk tmp_dir = 2;
  }
}

message TmpDirChunk {
  bytes zstd_chunk = 1;
  bool eof = 2;
}

message BuildRequest {
  string system = 1;
  string builder = 2;
  repeated string args = 3;
  map<string, string> env = 4;
  // Output name -> scratch store path.
  map<string, string> outputs = 5;
  repeated string input_paths = 6;
  string tmp_dir_in_sandbox = 7;
  string store_dir = 8;
  // Grants network in the sandbox (fixed-output or __impure).
  bool fixed_output = 9;
  // requiredSystemFeatures, resolved by attach from env or .attrs.json.
  repeated string required_features = 10;
}

message AttachEvent {
  oneof event {
    bytes log = 1;
    OutputNar output = 2;
    int32 exit_code = 3;
    string error = 4;
    // Discard any partially received NAR for this scratch path; the
    // build was handed to another worker attempt and the output will
    // be streamed again from the start.
    string output_restart = 5;
    // Store path the hub registered locally on attach's behalf
    // (recursive-nix extra). Goes into result.json for Nix's output
    // reference scan.
    string added_path = 6;
    // Name of the worker the build was dispatched to, for the client
    // to report where the build runs.
    string dispatched = 7;
  }
}

message OutputNar {
  string store_path = 1;
  bytes zstd_nar_chunk = 2;
  bool eof = 3;
}
