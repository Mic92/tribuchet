name: Build Docker Image
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-worker
jobs:
  # The image bundles Nix and a cross-built Nix is not in the binary cache, so
  # each architecture builds on its own runner and pushes an arch-suffixed
  # tag. The index job joins them.
  build:
    strategy:
      matrix:
        include:
          - system: x86_64-linux
            runs-on: ubuntu-latest
          - system: aarch64-linux
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    permissions:
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Create Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
            suffix=-${{ matrix.system }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
      - name: Setup Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://cache.thalheim.io
            extra-trusted-public-keys = cache.thalheim.io-1:R7msbosLEZKrxk/lKxf9BTjOOH7Ax3H0Qj0/6wiHOgc=
      - name: Build Docker image
        run: |
          nix build .#worker-image --print-build-logs
      - name: Push images
        env:
          REGCTL_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -xve
          PATH="$(nix build --inputs-from . nixpkgs#regctl --print-out-paths --no-link)/bin:$PATH"
          regctl registry login "$REGISTRY" -u "${{ github.actor }}" --pass-stdin <<< "$REGCTL_PASSWORD"
          regctl image import "ocidir://local:tribuchet-worker" ./result
          for tag in $(echo '${{ steps.meta.outputs.tags }}' | tr ' ' '\n'); do
            regctl image copy "ocidir://local:tribuchet-worker" "$tag"
          done
  # Publishes main and the release tags as multi-arch indexes over the
  # arch-suffixed images from the build matrix.
  index:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Create Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
      - name: Setup Nix
        uses: cachix/install-nix-action@v31
      - name: Push indexes
        env:
          REGCTL_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -xve
          PATH="$(nix build --inputs-from . nixpkgs#regctl --print-out-paths --no-link)/bin:$PATH"
          regctl registry login "$REGISTRY" -u "${{ github.actor }}" --pass-stdin <<< "$REGCTL_PASSWORD"
          for tag in $(echo '${{ steps.meta.outputs.tags }}' | tr ' ' '\n'); do
            regctl index create "$tag" --ref "$tag-x86_64-linux" --ref "$tag-aarch64-linux"
          done
  # GHCR stores superseded manifests, among them the per-arch children of old
  # indexes, as untagged versions. A naive "delete untagged"
  # (actions/delete-package-versions) broke every release tag once already in
  # niks3 (Mic92/niks3#291). ghcr-cleanup-action walks the index manifests and
  # only deletes children together with their last parent.
  cleanup:
    if: github.ref == 'refs/heads/main'
    needs: index
    runs-on: ubuntu-latest
    concurrency:
      group: ghcr-cleanup
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: tribuchet-worker
          exclude-tags: "v*,main*"
          keep-n-untagged: 5
          # regctl pushes children before the index; don't race an in-flight push.
          older-than: 1 day
          validate: true
