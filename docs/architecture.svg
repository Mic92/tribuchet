<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#475569"/>
    </marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#2563eb"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#059669"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .box   { fill: #fff; stroke: #cbd5e1; stroke-width: 1.2; filter: url(#sh); }
      .title { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .sub   { font-size: 11px; fill: #64748b; }
      .zone  { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
      .lbl   { font-size: 11px; fill: #475569; }
      .edge  { stroke: #475569; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="880" height="470" fill="#f8fafc"/>

  <!-- Hub machine -->
  <rect x="28" y="28" width="360" height="414" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="48" y="54" class="zone" fill="#4f46e5">Hub machine</text>

  <rect x="68" y="76" width="280" height="50" rx="10" class="box"/>
  <text x="208" y="106" text-anchor="middle" class="title">nix build</text>

  <rect x="68" y="160" width="280" height="50" rx="10" class="box"/>
  <text x="208" y="190" text-anchor="middle" class="title">nix-daemon</text>

  <rect x="68" y="244" width="280" height="50" rx="10" class="box"/>
  <text x="208" y="268" text-anchor="middle" class="title">tribuchet attach</text>
  <text x="208" y="284" text-anchor="middle" class="sub">external-builders shim</text>

  <rect x="68" y="340" width="280" height="72" rx="10" fill="#4f46e5" filter="url(#sh)"/>
  <text x="208" y="372" text-anchor="middle" class="title" fill="#fff">hub</text>
  <text x="208" y="390" text-anchor="middle" font-size="11" fill="#c7d2fe">queue · dedupe · chunk cache</text>

  <path d="M208 126 V158" class="edge" marker-end="url(#a)"/>
  <path d="M208 210 V242" class="edge" marker-end="url(#a)"/>
  <text x="218" y="232" class="lbl">exec, build.json</text>
  <path d="M208 294 V338" class="edge" marker-end="url(#a)"/>
  <text x="218" y="322" class="lbl">unix socket</text>

  <!-- Workers -->
  <rect x="492" y="28" width="360" height="414" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="512" y="54" class="zone" fill="#047857">Workers</text>

  <rect x="532" y="120" width="280" height="50" rx="10" fill="#fff" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="672" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#94a3b8">more workers …</text>

  <rect x="532" y="340" width="280" height="72" rx="10" fill="#059669" filter="url(#sh)"/>
  <text x="672" y="372" text-anchor="middle" class="title" fill="#fff">worker</text>
  <text x="672" y="390" text-anchor="middle" font-size="11" fill="#a7f3d0">chunk store · build slots</text>

  <rect x="532" y="220" width="132" height="64" rx="10" class="box"/>
  <text x="598" y="248" text-anchor="middle" class="title">build agent</text>
  <text x="598" y="266" text-anchor="middle" class="sub">sandbox · cgroup</text>

  <rect x="680" y="220" width="132" height="64" rx="10" class="box"/>
  <text x="746" y="248" text-anchor="middle" class="title">nix-daemon</text>
  <text x="746" y="266" text-anchor="middle" class="sub">worker store</text>

  <path d="M598 340 V286" class="edge" marker-end="url(#a)"/>
  <text x="540" y="318" class="lbl">run build</text>
  <path d="M746 340 V286" class="edge" marker-end="url(#a)"/>
  <text x="756" y="318" class="lbl">import inputs</text>

  <!-- hub <-> worker -->
  <path d="M350 362 H528" stroke="#2563eb" stroke-width="2.2" fill="none" marker-end="url(#ab)"/>
  <text x="440" y="354" text-anchor="middle" class="lbl" fill="#1d4ed8">assignment · input chunks</text>
  <path d="M532 390 H354" stroke="#059669" stroke-width="2.2" fill="none" marker-end="url(#ag)"/>
  <text x="440" y="406" text-anchor="middle" class="lbl" fill="#047857">logs · output chunks</text>
  <text x="440" y="380" text-anchor="middle" class="sub">gRPC · mTLS · workers dial in</text>
</svg>
